name: Release
run-name: Release ${{ inputs.version }}

# Releases are cut by hand, never by pushing a tag:
#   Actions → Release → Run workflow → version: 1.2.3
#
# Give the version without a leading "v" — the workflow adds it when creating
# the tag, so tags stay SemVer-compatible (v1.2.3).
#
# The tag is a *result* of this run. It is created locally for the build, and
# pushed to origin only once every artifact exists, so a failed run leaves no
# tag behind.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (you publish it yourself)"
        type: boolean
        default: false
      dry_run:
        description: "Build everything, but do not tag or publish"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin every job to the commit the run started from, and fetch all
          # history so GoReleaser can build a changelog.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Normalise and validate version
        id: version
        env:
          # Never interpolate ${{ inputs.* }} straight into a run script.
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"   # tolerate a leading v, then own the prefix
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a SemVer version such as 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $(git rev-parse --short HEAD)"

      # Every change is expected to land in CHANGELOG.md, so a missing entry is
      # a mistake worth failing on rather than papering over.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION. Add a '## [$VERSION] - <date>' section."
            exit 1
          fi
          echo "Release notes:"
          cat release-notes.md

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      # Provides `syft`, used by the sboms section of .goreleaser.yaml.
      - uses: anchore/sbom-action/download-syft@v0

      # GoReleaser derives the version from the tag, so it must exist before the
      # build. Local only — nothing is pushed from this job.
      - name: Create tag locally
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"

      - name: Build artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce

      # `ls` errors on a glob that matches nothing, so this fails the run before
      # anything is published.
      - name: Verify artifacts exist
        run: |
          ls -lh dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.apk \
                 dist/*.sbom.json dist/checksums.txt
          # Carry the notes alongside the artifacts so every path in the
          # uploaded artifact is rooted at dist/ and survives the round trip.
          mv release-notes.md dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.sbom.json
            dist/checksums.txt
            dist/release-notes.md
          retention-days: 7

  windows-installer:
    name: build Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Ensure Inno Setup is available
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) {
            Write-Host "Inno Setup not present on this image - installing via Chocolatey"
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found after install" }
          Write-Host "Using $iscc"
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build installers
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path installers | Out-Null

          foreach ($arch in @('amd64', 'arm64')) {
            $zip = "dist/gha-mcp_${env:VERSION}_windows_$arch.zip"
            if (-not (Test-Path $zip)) { throw "missing archive: $zip" }

            $stage = "stage/$arch"
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null

            # The archive already carries gha-mcp.exe, README.md and LICENSE.
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            Copy-Item scripts/configure-ai-clients.ps1 $stage/
            Copy-Item CHANGELOG.md $stage/
            Copy-Item installer/windows/INSTALL-NOTES.txt $stage/

            Write-Host "::group::Compiling installer for $arch"
            & "${{ steps.iscc.outputs.path }}" `
              "/DAppVersion=${env:VERSION}" `
              "/DArch=$arch" `
              "/DStageDir=$(Resolve-Path $stage)" `
              "/DOutputDir=$(Resolve-Path installers)" `
              installer/windows/gha-mcp.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch with exit code $LASTEXITCODE" }
            Write-Host "::endgroup::"
          }

          Get-ChildItem installers

      # Checksums for the installers, in the same format as GoReleaser's file.
      - name: Checksum installers
        shell: bash
        run: |
          cd installers
          sha256sum *_setup.exe > installers-checksums.txt
          cat installers-checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: installers/
          retention-days: 7

  publish:
    name: publish release
    needs: [build, windows-installer]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: dist

      - name: Merge checksums
        run: |
          cat dist/installers-checksums.txt >> dist/checksums.txt
          rm dist/installers-checksums.txt
          sort -k2 dist/checksums.txt -o dist/checksums.txt
          cat dist/checksums.txt

      - name: Push tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: gha-mcp ${{ needs.build.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # The changelog entry, with GitHub's generated commit list appended.
          body_path: dist/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: ${{ !inputs.prerelease && !inputs.draft }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_setup.exe
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.sbom.json
            dist/checksums.txt
