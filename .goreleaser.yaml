# GoReleaser configuration — https://goreleaser.com
#
# Local sanity check (no publishing, writes to ./dist):
#   goreleaser check
#   goreleaser release --snapshot --clean
#
# Real releases are cut by .github/workflows/release.yml on a pushed tag.
version: 2

project_name: gha-mcp

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gha-mcp
    main: .
    binary: gha-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - gha-mcp
    formats:
      - tar.gz
    # Windows users expect a zip they can open without extra tooling.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      # Flattened into the archive root so users can run them straight after
      # extracting. The Windows installer bundles the .ps1 separately.
      - src: scripts/configure-ai-clients.*
        dst: .

# Linux system packages, built with nfpm — no Docker or native tooling needed.
nfpms:
  - id: packages
    ids:
      - gha-mcp
    package_name: gha-mcp
    vendor: pcpl2
    homepage: https://github.com/pcpl2/github-actions-versions-mcp
    maintainer: Patryk Ławicki <open-source@pcpl2.ovh>
    description: |-
      MCP server that reports the latest released versions of GitHub Actions.
      Answers whether a pinned action ref (e.g. actions/checkout@v3) is stale.
    license: BSD-2-Clause
    section: utils
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gha-mcp/LICENSE
      - src: README.md
        dst: /usr/share/doc/gha-mcp/README.md

# macOS/Linux distribution via a Homebrew cask (the current GoReleaser
# recommendation for pre-built binaries; `brews`/`homebrew_formulas` are
# deprecated).
#
# DISABLED for now: publishing needs a separate public repo
# github.com/pcpl2/homebrew-tap plus a PAT with `contents: write` on it. The
# cask is still generated into ./dist so the config stays exercised. To enable:
# create the tap repo, add a TAP_GITHUB_TOKEN secret, set skip_upload to false
# and restore the `token:` line below.
homebrew_casks:
  - name: gha-mcp
    ids:
      - default
    binaries:
      - gha-mcp
    homepage: https://github.com/pcpl2/github-actions-versions-mcp
    description: MCP server that reports the latest released versions of GitHub Actions
    skip_upload: true
    # Required because `release.disable` is set: GoReleaser can no longer infer
    # the download URL. Points at the assets the release workflow uploads.
    url:
      template: https://github.com/pcpl2/github-actions-versions-mcp/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    repository:
      owner: pcpl2
      name: homebrew-tap
      branch: main
    commit_author:
      name: goreleaserbot
      email: open-source@pcpl2.ovh
    commit_msg_template: "cask: {{ .ProjectName }} {{ .Tag }}"
    # The binaries are not Apple-notarized, so macOS would quarantine them.
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gha-mcp"]
          end

# Windows distribution via a Scoop bucket. DISABLED for the same reason as the
# Homebrew cask above — it needs github.com/pcpl2/scoop-bucket and a PAT.
scoops:
  - name: gha-mcp
    ids:
      - default
    homepage: https://github.com/pcpl2/github-actions-versions-mcp
    description: MCP server that reports the latest released versions of GitHub Actions
    license: BSD-2-Clause
    skip_upload: true
    url_template: https://github.com/pcpl2/github-actions-versions-mcp/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    repository:
      owner: pcpl2
      name: scoop-bucket
      branch: main
    commit_author:
      name: goreleaserbot
      email: open-source@pcpl2.ovh
    commit_msg_template: "scoop: {{ .ProjectName }} {{ .Tag }}"

# Software Bill of Materials per archive, generated with syft. The filename is
# pinned so the release workflow can match it with a `dist/*.sbom.json` glob.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other work
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"

# GoReleaser only builds here — it never touches GitHub. The release itself is
# created by softprops/action-gh-release in .github/workflows/release.yml, which
# uploads everything from ./dist. That keeps the whole pipeline on the built-in
# GITHUB_TOKEN, with no extra secrets to configure.
release:
  disable: true
